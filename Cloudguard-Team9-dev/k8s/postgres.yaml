apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudguard-postgres-pvc
  namespace: cloudguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-postgres
  namespace: cloudguard
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudguard-postgres

  template:
    metadata:
      labels:
        app: cloudguard-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cloudguard-secrets
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cloudguard-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudguard-secrets
                  key: POSTGRES_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: cloudguard-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: cloudguard-postgres
  namespace: cloudguard
spec:
  selector:
    app: cloudguard-postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP