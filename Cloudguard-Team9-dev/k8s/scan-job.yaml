apiVersion: batch/v1
kind: Job
metadata:
  name: cloudguard-scan
  namespace: cloudguard

spec:
  backoffLimit: 2

  template:
    metadata:
      labels:
        app: cloudguard-scan

    spec:
      restartPolicy: Never

      containers:
        - name: scan
          image: cloudguard:latest
          imagePullPolicy: IfNotPresent

          command:
            - cloudguard
            - scan
            - --subscription-id
            - "1"

          envFrom:
            - configMapRef:
                name: cloudguard-config

            - secretRef:
                name: cloudguard-secrets