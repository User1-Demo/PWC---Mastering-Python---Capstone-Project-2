name: CloudGuard CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Lint, Test and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: cloudguard_test
          POSTGRES_USER: cloudguard
          POSTGRES_PASSWORD: cloudguard

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U cloudguard -d cloudguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cloudguard:cloudguard@localhost:5432/cloudguard_test

      JWT_SECRET_KEY: github-actions-test-secret-only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      APP_NAME: CloudGuard
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check src tests

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Verify migration state
        run: |
          alembic current

      - name: Run tests with coverage
        run: |
          pytest -v --cov=cloudguard --cov-report=term-missing

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CloudGuard image
        run: |
          docker build -t cloudguard:${{ github.sha }} .