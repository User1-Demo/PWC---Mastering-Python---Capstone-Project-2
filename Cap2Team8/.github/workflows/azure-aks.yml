name: Build and deploy to Azure AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  KUBERNETES_NAMESPACE: cloudguard

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: utilities/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/cloudguard-api:${{ github.sha }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Create namespace and application secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_USERNAME: ${{ secrets.SEED_ADMIN_USERNAME }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_ENGINEER_USERNAME: ${{ secrets.SEED_ENGINEER_USERNAME }}
          SEED_ENGINEER_PASSWORD: ${{ secrets.SEED_ENGINEER_PASSWORD }}
          SEED_SECURITY_USERNAME: ${{ secrets.SEED_SECURITY_USERNAME }}
          SEED_SECURITY_PASSWORD: ${{ secrets.SEED_SECURITY_PASSWORD }}
        run: |
          set -euo pipefail
          required_vars=(
            DATABASE_URL JWT_SECRET_KEY POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
            SEED_ADMIN_USERNAME SEED_ADMIN_PASSWORD
            SEED_ENGINEER_USERNAME SEED_ENGINEER_PASSWORD
            SEED_SECURITY_USERNAME SEED_SECURITY_PASSWORD
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub secret $name is not set."
              exit 1
            fi
          done

          kubectl create namespace "$KUBERNETES_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic cloudguard-secrets \
            --namespace "$KUBERNETES_NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=SEED_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            --from-literal=SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            --from-literal=SEED_ENGINEER_USERNAME="$SEED_ENGINEER_USERNAME" \
            --from-literal=SEED_ENGINEER_PASSWORD="$SEED_ENGINEER_PASSWORD" \
            --from-literal=SEED_SECURITY_USERNAME="$SEED_SECURITY_USERNAME" \
            --from-literal=SEED_SECURITY_PASSWORD="$SEED_SECURITY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f utilities/k8s/app.yaml

      - name: Update API image
        run: |
          kubectl set image deployment/cloudguard-api \
            api="${{ vars.ACR_NAME }}.azurecr.io/cloudguard-api:${{ github.sha }}" \
            --namespace "$KUBERNETES_NAMESPACE"

      - name: Wait for rollout
        run: |
          kubectl rollout status statefulset/postgres \
            --namespace "$KUBERNETES_NAMESPACE" --timeout=5m
          kubectl rollout status deployment/cloudguard-api \
            --namespace "$KUBERNETES_NAMESPACE" --timeout=5m
