[project]
name = "cloudguard"
version = "0.1.0"
description = "CloudGuard - Automated Cloud Infrastructure Compliance & Remediation Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "tenacity>=8.2",
    "azure-identity>=1.16",
    "azure-mgmt-compute>=30.6",
    "azure-mgmt-network>=25.3",
    "azure-mgmt-keyvault>=10.3",
    "azure-mgmt-resource>=23.0",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
cloudguard = "cloudguard.cli.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=cloudguard --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100

[tool.coverage.run]
omit = [
    "*/cli/*",
    "*/scripts/*",
    "*/scheduler.py",
]