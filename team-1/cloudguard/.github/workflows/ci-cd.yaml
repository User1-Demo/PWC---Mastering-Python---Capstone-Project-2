name: CloudGuard CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src --ignore-missing-imports || true
      - name: Run tests with coverage (Azure mocked / fixtures)
        env:
          CLOUDGUARD_AZURE_USE_FIXTURES: "true"
          CLOUDGUARD_JWT_SECRET: "ci-test-secret"
        run: pytest --cov=cloudguard --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with: {name: coverage-report, path: coverage.xml}

  build-push:
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY }}/cloudguard/api:${{ github.sha }},${{ secrets.REGISTRY }}/cloudguard/api:latest
      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ secrets.REGISTRY }}/cloudguard/scan-worker:${{ github.sha }},${{ secrets.REGISTRY }}/cloudguard/scan-worker:latest

  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
      - name: Deploy manifests
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl set image deployment/cloudguard-api api=${{ secrets.REGISTRY }}/cloudguard/api:${{ github.sha }} -n cloudguard || kubectl apply -f k8s/deployment-api.yaml
          kubectl apply -f k8s/service-api.yaml
          kubectl apply -f k8s/cronjob-scan.yaml
      - name: Verify rollout
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/cloudguard-api -n cloudguard --timeout=120s