apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudguard-config
  namespace: cloudguard
data:
  CLOUDGUARD_AZURE_USE_FIXTURES: "true"
  CLOUDGUARD_K8S_NAMESPACE: "cloudguard"
  CLOUDGUARD_K8S_IN_CLUSTER: "true"
  CLOUDGUARD_SCAN_WORKER_IMAGE: "cloudguard/scan-worker:latest"
  CLOUDGUARD_REMEDIATION_WORKER_IMAGE: "cloudguard/remediation-worker:latest"