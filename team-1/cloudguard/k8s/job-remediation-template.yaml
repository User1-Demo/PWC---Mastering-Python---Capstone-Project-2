apiVersion: batch/v1
kind: Job
metadata:
  generateName: remediate-
  namespace: cloudguard
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: remediation-worker
          image: cloudguard/remediation-worker:latest
          args: ["cloudguard.workers.remediation_worker", "--finding-id", "FINDING_ID", "--actor", "ACTOR"]
          envFrom:
            - configMapRef: {name: cloudguard-config}
            - secretRef: {name: cloudguard-secrets}