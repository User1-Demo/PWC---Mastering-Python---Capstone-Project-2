[project]
name = "capstone2"
version = "0.1.0"
description = "Azure infrastructure compliance and remediation MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3", "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2", "bcrypt<4.1", "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2,<4", "typer>=0.12,<1", "httpx>=0.27,<1",
  "azure-identity>=1.17,<2", "azure-mgmt-resource>=23,<24",
  "azure-mgmt-network>=27,<29", "azure-mgmt-compute>=33,<35",
  "azure-keyvault-secrets>=4.8,<5", "tenacity>=9,<10"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]
[project.scripts]
capstone2 = "capstone2.cli:app"
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
[tool.ruff]
line-length=100
