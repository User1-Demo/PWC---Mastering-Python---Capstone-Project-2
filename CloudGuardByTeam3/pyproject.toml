[project]
name = "cloudguardbyteam3"
version = "0.1.0"
description = "CloudGuard Phase 1 foundation: FastAPI, JWT RBAC, PostgreSQL-ready persistence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.6,<3.0", "PyJWT>=2.9,<3.0", "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.12,<1.0", "psycopg[binary]>=3.2,<4.0", "email-validator>=2.2,<3.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0", "mypy>=1.13,<2.0"]
azure = ["azure-identity>=1.19,<2.0", "azure-mgmt-resource>=23.2,<24.0", "azure-mgmt-compute>=33.0,<34.0", "azure-mgmt-network>=28.0,<29.0", "azure-keyvault-secrets>=4.9,<5.0"]
[project.scripts]
cloudguard = "cloudguard.cli.main:main"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
