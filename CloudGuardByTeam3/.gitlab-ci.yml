stages: [quality, test, build]
image: python:3.11-slim
before_script:
  - python -m pip install --upgrade pip
  - pip install -e ".[dev]"
ruff:
  stage: quality
  script: ["ruff check src tests"]
pytest:
  stage: test
  variables:
    DATABASE_URL: "sqlite:///./ci_cloudguard.db"
    JWT_SECRET_KEY: "ci-only-secret-key-change-me"
  script: ["pytest -q"]
docker-build:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script: ["docker build -t cloudguardbyteam3:$CI_COMMIT_SHORT_SHA ."]
