name: Deploy CloudGuard staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloudguard:${{ github.sha }}
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        shell: bash
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Apply and deploy
        shell: bash
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/api.yaml
          kubectl apply -f k8s/cronjob.yaml
          kubectl set image deployment/cloudguard-api api=ghcr.io/${{ github.repository_owner }}/cloudguard:${{ github.sha }} -n cloudguard
          kubectl set env deployment/cloudguard-api WORKER_IMAGE=ghcr.io/${{ github.repository_owner }}/cloudguard:${{ github.sha }} -n cloudguard
          kubectl set image cronjob/cloudguard-scheduled-scans scheduler=ghcr.io/${{ github.repository_owner }}/cloudguard:${{ github.sha }} -n cloudguard
          kubectl rollout status deployment/cloudguard-api -n cloudguard --timeout=180s
