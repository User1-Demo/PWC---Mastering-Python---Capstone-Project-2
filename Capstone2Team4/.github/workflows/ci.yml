name: CloudGuard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test,dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
        env:
          JWT_SECRET: ci-only-not-a-production-secret
          AZURE_PROVIDER: mock
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
