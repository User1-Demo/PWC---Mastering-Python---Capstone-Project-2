apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-api
  namespace: cloudguard-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudguard-api
  template:
    metadata:
      labels:
        app: cloudguard-api
    spec:
      serviceAccountName: cloudguard-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: cloudguard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: cloudguard-secrets
          env:
            - name: APP_ENV
              value: development
            - name: EXECUTION_MODE
              value: kubernetes
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloudguard-api
  namespace: cloudguard-staging
spec:
  selector:
    app: cloudguard-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP



