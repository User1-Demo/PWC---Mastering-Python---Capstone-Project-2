apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudguard-scheduled-scans
  namespace: cloudguard-staging
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: cloudguard-scheduled-scans
        spec:
          serviceAccountName: cloudguard-api
          restartPolicy: Never
          containers:
            - name: scheduler
              image: cloudguard:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.cli", "schedule-all"]
              envFrom:
                - secretRef:
                    name: cloudguard-secrets
              env:
                - name: APP_ENV
                  value: development
                - name: EXECUTION_MODE
                  value: kubernetes
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]


