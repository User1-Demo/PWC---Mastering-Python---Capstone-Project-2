[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard"
version = "0.1.0"
description = "Azure cloud compliance scanning and safe remediation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "typer>=0.12,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "azure-identity>=1.17,<2.0",
  "azure-mgmt-resource>=23.1,<24.0",
  "azure-mgmt-network>=25.0,<31.0",
  "azure-keyvault-secrets>=4.8,<5.0",
  "kubernetes>=30.1,<34.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10.0", "httpx>=0.27,<1.0", "pytest-cov>=5.0,<7.0"]
dev = ["ruff>=0.8,<1.0", "mypy>=1.13,<2.0"]

[project.scripts]
cloudguard = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["app.rules.engine", "app.services.remediation"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
